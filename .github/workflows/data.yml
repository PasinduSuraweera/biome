name: Refresh data

# Downloads NASA data on GitHub's servers, runs the Biome analysis and
# commits the results. Live reservoir/river data and MODIS greenness have
# their own workflows (live.yml, modis.yml) and are picked up from the repo.
# Needs two repository secrets: EARTHDATA_USERNAME and EARTHDATA_PASSWORD.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/data-refresh.txt
  schedule:
    - cron: "30 1 * * *"   # daily, 07:00 in Sri Lanka

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  nasa:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        dataset: [imerg_final, imerg_late_daily, gldas, merra2_flx, merra2_lnd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Cache granule results (resume, and skip months already done)
        uses: actions/cache@v4
        with:
          path: data/raw/${{ matrix.dataset }}
          key: raw-${{ matrix.dataset }}-${{ github.run_id }}
          restore-keys: raw-${{ matrix.dataset }}-
      - name: Download ${{ matrix.dataset }}
        working-directory: pipeline
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python fetch_nasa.py ${{ matrix.dataset }} --workers 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasa-${{ matrix.dataset }}
          path: data/processed/${{ matrix.dataset }}.csv
          if-no-files-found: warn

  analyze:
    needs: [nasa]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: nasa-* }
      - name: Gather NASA files (live data and MODIS already in the repo)
        run: |
          git pull --rebase origin main
          mkdir -p data/processed
          find artifacts -name '*.csv' -exec cp {} data/processed/ \;
          ls -la data/processed
      - name: Save the NASA district tables first (kept even if the analysis fails)
        run: |
          git config user.name "PasinduSuraweera"
          git config user.email "pasisuraweera2003@gmail.com"
          git add data/processed
          git diff --cached --quiet || git commit -m "NASA district tables $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
      - name: Candidate evacuation centres (OpenStreetMap)
        continue-on-error: true
        working-directory: pipeline
        run: python fetch_places.py
      - name: Run analysis
        working-directory: pipeline
        run: |
          git show HEAD:web/public/data/biome.json > /tmp/previous_biome.json 2>/dev/null || echo '{}' > /tmp/previous_biome.json
          python analysis.py
      - name: Alerts for districts that moved up a Watch level
        continue-on-error: true
        working-directory: pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIOME_SITE_URL: ${{ vars.BIOME_SITE_URL }}
        run: python alerts.py /tmp/previous_biome.json ../web/public/data/biome.json
      - name: Commit results
        run: |
          git config user.name "PasinduSuraweera"
          git config user.email "pasisuraweera2003@gmail.com"
          git add data/processed web/public/data
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
