name: Publish site

# Builds the web app (and the new design at /v2/) and publishes it to GitHub
# Pages whenever the app changes or a data workflow finishes. Data commits made
# by other workflows do not trigger pushes, so workflow_run picks them up.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/**
      - web-v2/**
  workflow_run:
    workflows: ["Refresh data", "Refresh live reservoirs and rivers", "NASA images and terrain", "Refresh MODIS greenness", "NASA videos"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "web*/package-lock.json" }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: New design (shadcn/ui), published at /v2/ next to the classic app
        working-directory: web-v2
        run: |
          npm ci
          npm run build
          rm -rf ../web/dist/v2 && cp -r dist ../web/dist/v2
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
