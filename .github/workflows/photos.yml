name: Photo candidates

# Finds freely licensed photos of Sri Lanka on Wikimedia Commons and uploads them
# as a run artifact, so the best can be chosen and credited by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python pipeline/photo_candidates.py photos
      - name: Push the candidates to the photo-candidates branch (not main)
        run: |
          cd photos
          git init -q -b photo-candidates
          git config user.name "PasinduSuraweera"
          git config user.email "pasisuraweera2003@gmail.com"
          git add . && git commit -qm "Photo candidates"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" photo-candidates
