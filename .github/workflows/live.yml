name: Refresh live reservoirs and rivers

# NOAA El Nino index and rain gauges, Irrigation Department reservoirs,
# river gauges and the Nov 2025 flood map, plus NASA IMERG Early daily rain
# (about 4 hours after each day ends) so the daily levels and alerts are as
# fresh as NASA allows. Runs every 3 hours.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/live.yml
      - pipeline/fetch_irrigation.py
      - pipeline/fetch_ground.py
      - pipeline/subscribers.py
      - pipeline/analysis.py
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

concurrency:
  group: commit-data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Download
        working-directory: pipeline
        run: |
          python fetch_ground.py
          python fetch_irrigation.py
      - name: Cache NASA IMERG Early days
        uses: actions/cache@v4
        with:
          path: |
            data/raw/imerg_early_daily
            data/raw/imerg_early_towns
          key: raw-imerg-early-${{ github.run_id }}
          restore-keys: raw-imerg-early-
      - name: NASA IMERG Early daily rain (newest days)
        continue-on-error: true
        working-directory: pipeline
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python fetch_nasa.py imerg_early_daily --workers 4
          python fetch_nasa.py imerg_early_towns --workers 4
      - name: Daily levels from the newest rain
        continue-on-error: true
        working-directory: pipeline
        env:
          BIOME_BOT: ${{ vars.BIOME_BOT }}
        run: python analysis.py
      - name: Registered people (kept in the private cache, never committed)
        uses: actions/cache@v4
        with:
          path: data/private
          key: subscribers-${{ github.run_id }}
          restore-keys: subscribers-
      - name: Read new alert sign-ups
        continue-on-error: true
        working-directory: pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BIOME_SITE_URL: ${{ vars.BIOME_SITE_URL }}
        run: |
          python subscribers.py sync
          python subscribers.py send ../web/public/data/biome.json
      - name: Commit
        run: |
          git config user.name "PasinduSuraweera"
          git config user.email "pasisuraweera2003@gmail.com"
          git add data/processed web/public/data
          git diff --cached --quiet || git commit -m "Live data $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
